# Основная конфигурация Aero AC
# Исходный код: https://github.com/MWHunter/Grim
# Авторское право 2025 DefineOutside и соавторы, лицензия GPLv3.
# Модифицированные двоичные файлы, или плагины со скопированным исходным кодом, должны быть приватными,
# или с полным исходным кодом, доступным покупателям без дополнительной платы.

alerts:
    # Кроме трансляции оповещений игрокам, должны ли они также отправляться на консоль?
    print-to-console: true
    # Это контролирует, будут ли/как будут передаваться оповещения между серверами, подключенными к вашему прокси.
    # У вас должен быть включен 'bungee-plugin-message-channel' в конфигурации Velocity, если используется Velocity.
    proxy:
        # Следует ли отправлять оповещения на другие серверы, подключенные к вашему прокси-серверу?
        send: false
        # Должны ли оповещения, полученные с других серверов, быть объявлены на этом сервере?
        receive: false

verbose:
    print-to-console: false

check-for-updates: true

client-brand:
    # Это означает, что он не будет транслировать свой бренд операторам, если бренд соответствует следующим регексам
    ignored-clients:
        - "^vanilla$"
        - "^fabric$"
        - "^quilt$"
        - "^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4},(?:fabric|forge)$"
        - "^Feather Fabric$"
        - "^labymod$"
    # Grim will blacklist specific Forge versions which include built-in Reach hacks (Forge 1.18.2 to 1.19.3).
    # Setting this option to false will allow said clients to connect to the server. Disable this at your own risk.
    disconnect-blacklisted-forge-versions: true

spectators:
    # Скрыть всех зрителей с разрешением grim.spectator, независимо от того, являются ли они активными зрителями.
    hide-regardless: false
    # Будет делать зрителей скрытыми только в этих мирах. Оставьте пустым, чтобы разрешить все миры
    allowed-worlds:
        - ""

# Сколько времени должно быть у игроков, пока мы не выкинем их за тайм-аут? По умолчанию = 60 секунд
max-transaction-time: 60

# Enable this to stop Grim cancelling pongs received from players.
# This may improve compatibility with other anticheats. It may cause issues with packet limiters.
# Do not enable this if you are not sure what you are doing.
disable-pong-cancelling: false

# Нужно ли отключить стандартный обработчик рассинхронизации блоков?
# По умолчанию Grim считывает блоки из мира сервера и отправляет их клиенту для исправления рассинхронизации.
# Если вы используете плагины, создающие фейковые блоки через пакеты (которых нет в мире сервера),
# вам следует установить значение true, чтобы Grim не перезаписывал их воздухом или реальными блоками.
# Это принудительно включает использование обработчика "NoOp" (бездействия), если через API не предоставлен свой.
disable-default-resync-handler: false

# Should the duplicate movement packet be cancelled?
# Mojang has fixed this issue in 1.21. This was their attempt to fix the "bucket desync". https://bugs.mojang.com/browse/MC-12363
# This setting only applies to 1.17-1.20.5 clients on 1.8 servers.
cancel-duplicate-packet: true

# Whether or not to ignore the rotation in duplicate packets
ignore-duplicate-packet-rotation: false

Simulation:
    # На сколько мы должны умножить общее преимущество, когда игрок легален.
    # Вот как выглядит конфигурация по умолчанию (ось x = секунды, ось y = 1/1000 блока): https://www.desmos.com/calculator/d4ufgxrxer
    setback-decay-multiplier: 0.999
    # Для какого смещения от движения игрока мы должны создать нарушение?
    # Измеряется в блоках от возможного движения
    # Мы учитываем Optifine, переключая таблицы триггеров, но снижение этого значения до 0.001 уменьшит FastMath
    # будем отмечать античит, если эта компенсация не сработает...
    threshold: 0.001
    # Насколько велико нарушение в тике, прежде чем игрок получит немедленный откат?
    # -1 для отключения
    immediate-setback-threshold: 0.1
    # Насколько велико преимущество над всеми тиками, прежде чем мы начнем делать откат?
    # -1 для отключения
    max-advantage: 1
    # После 50 секунд с конфигурацией по умолчанию игрок перейдет от 4 блоков -> 1 блок преимущества.
    # Это сделано для того, чтобы игрок не собирал слишком много нарушений и никогда не смог очистить их все.
    # Потолок преимущества по умолчанию (ось x = секунды, ось y = 1/1000 блока): https://www.desmos.com/calculator/4lovswdarj
    max-ceiling: 4
    # Порог уровня нарушения для отката
    # 1 для старого поведения
    setback-violation-threshold: 1

# Проверяет, вошел ли игрок в блок во время движения.
Phase:
    setbackvl: 1 # Глитч с блоками может позволить забраться на стену, к тому же эта проверка относительно стабильна
    decay: 0.005

AirLiquidPlace:
    cancelvl: 0

FabricatedPlace:
    cancelvl: 5

FarPlace:
    cancelvl: 5

PositionPlace:
    cancelvl: 5

RotationPlace:
    cancelvl: 5

# Основанная на предсказаниях проверка на отсутствие замедления
# Grim учитывает баги неткода здесь... трудно ошибиться, даже если спамить правым кликом и кнопкой оффхенд.
# Намного стабильнее, чем другие античиты, но, пожалуйста, сообщайте о любых фейлах... Я исправил тонну проблем с неткодом.
NoSlow:
    # Насколько большое смещение является "читерством".
    # По умолчанию это меньше, чем другие смещения
    # Флаги на 0.03-0.2 последовательно при включенном NoSlow
    threshold: 0.001
    # Быстрое отступление на первом пункте, чтобы убрать любое преимущество, которое дает NoSlow
    setbackvl: 5
    # Распад происходит, когда игрок использует предмет И замедляется им
    decay: 0.05
    # Разрозненные тики без замедления (NoSlow «пропускать замедление через тик») добавляют 1 в буфер,
    # каждый остальной тик вычитает buffer-decay; проверка флагает, когда буфер достигает этого значения.
    # По умолчанию ловится любой пропуск замедления чаще, чем один тик из шести.
    buffer: 2.0
    buffer-decay: 0.2

Knockback:
    # На сколько мы должны умножить общее преимущество, когда игрок легален.
    setback-decay-multiplier: 0.999
    # Для какого смещения от движения игрока мы должны создать нарушение?
    # Измеряется в блоках от возможного движения
    threshold: 0.001
    # Насколько велико нарушение в тике, прежде чем игрок получит немедленный откат?
    # -1 для отключения
    immediate-setback-threshold: 0.1
    # Насколько велико преимущество над всеми тиками, прежде чем мы начнем делать откат?
    # -1 для отключения
    max-advantage: 1
    # Это сделано для того, чтобы игрок не собирал слишком много нарушений и никогда не смог очистить их все.
    max-ceiling: 4


Explosion:
    threshold: 0.001
    setbackvl: 3

TimerA:
    setbackvl: 10
    # Миллисекунды, которые игрок может накапливать для последующего использования, когда он отстает.
    # Потенциально может позволить 1.8 обходов: быстрое использование/быстрое исцеление/быстрый лук, если установлено слишком высокое значение, 120 мс кажется хорошим балансом
    drift: 120

# This check limits abuse of the TimerA balance by preventing the player's movement falling too far behind realtime
TimerLimit:
    # Ping at which the check will start to limit timer balance, to prevent abuse.
    # Can cause some setbacks for legitimate players but only if they are over this ping threshold.
    # -1 to disable
    ping-abuse-limit-threshold: 1000

# Только клиенты 1.21.2+: клиент продолжает тикать, но перестаёт присылать позицию («AirStuck»,
# зависание в воздухе с ударами по игрокам). Ванильный клиент присылает позицию минимум раз в 20 тиков,
# поэтому значение не бывает меньше 20. Флаг откатывает игрока и отменяет его удары, пока он не подчинится.
AirStuck:
    max-ticks: 25

NegativeTimer:
    # Количество миллисекунд, потерянных во время движения, до того, как мы начнем ставить флаг
    drift: 1200

# Тот же метод проверки, что и у TimerA, но для транспортных средств
VehicleTimer:
    # Цель 1.005 таймер
    setbackvl: 10

PacketOrderI:
    # Включить, если игроки помечаются из-за использования модов анимации 1.7
    exempt-placing-while-digging: false

Reach:
    # На сколько мы должны расширить хитбоксы? 0.0005 должно определять 3.0005+ дополнительное достижение
    #
    # Существует 0.03 принудительное расширение с 1.9-1.18.1 (не 1.18.2), или некоторыми комбинациями клиент/сервер из-за
    # изменениями и ограничениями протокола. Эта проверка наиболее эффективна с клиентами 1.7/1.8 на серверах 1.8.
    threshold: 0.0005
    # Должны ли мы отменять удары, которые, как мы знаем, невозможны?
    # Удары 3.00-3.03 могут пройти, но все равно будут замечены из-за ограничений на порядок пакетов.
    block-impossible-hits: true
    # Это отправит дополнительный пакет в конце каждого тика, чтобы увеличить вероятность поимки читов.
    # Это встраивается в список соединений сервера для отправки последнего пакета непосредственно перед тем, как сервер будет удален.
    # Включение этой функции увеличит использование полосы пропускания для всех игроков.
    # Это не снизит общую производительность сервера
    # Если включить эту функцию, будет поймано больше читеров.
    # Если оставить эту функцию отключенной, читеры все равно будут отлавливаться и не будут вызывать ложных срабатываний.
    # Если вы не являетесь PvP-сервером 1.8, этот дополнительный пакет не рекомендуется.
    enable-post-packet: false

exploit:
    allow-sprint-jumping-when-using-elytra: true
    # Эта опция смягчает размещение игрока на блоках-призраках, ресинхронизируя его, когда это происходит.
    allow-building-on-ghostblocks: true
    distance-to-check-if-ghostblocks: 2

# Включить запись в журнал плагинов, которые внедрились в netty при присоединении для отладки проблем совместимости
debug-pipeline-on-join: false

# Включает экспериментальные проверки
experimental-checks: false

reset-item-usage-on-item-update: true
reset-item-usage-on-attack: true
reset-item-usage-on-slot-change: true
reset-item-usage-on-item-use: true

# Грим иногда отменяет незаконные пакеты, например, с таймером, после X пакетов в секунду отмененных, когда следует
# нам просто кикнуть игрока? Это необходимо, так как некоторые ограничители пакетов не учитывают пакеты, отмененные Гримом.
packet-spam-threshold: 100
# Включите, чтобы вывести stacktrace, когда игрок кикается из-за packet-spam-threshold
debug-packet-cancel: false

# Grim может обеспечить, чтобы у игрока, выведенного из состояния полёта, пинг не превышал X мс
# Это связано с тем, что Grim пока не проверяет игроков, находящихся в полёте
# Для отключения используйте -1
max-ping-out-of-flying: 1000

# Максимальный пинг при снятии ускорения фейерверком с игрока.
# Это предотвращает возможность для игроков с большим пингом бесконечно использовать один фейерверк‑буст с элитрой.
max-ping-firework-boost: 1000

# Маркеры схемы — менять только если понимаете, что делаете.
#   config-flavor:  V2 = сборка Grim 2.x, V3 = Grim 3.x. Плагин отказывается
#                   загружать конфиг, чей flavor не совпадает с его собственной
#                   сборкой: V3-конфиг, открытый V2-jar, немедленно падает с
#                   ошибкой вместо того чтобы молча слиться в неверные ключи.
#   config-version: увеличивается при каждом несовместимом изменении формата.
#                   Старые конфиги при следующем запуске автоматически
#                   мигрирует встроенный updater.
# Grim всегда обновляет кэшированные права, когда игрок заходит и когда Grim
# перезагружается, независимо от того, установлен ли LuckPerms.
# Хуки событий LuckPerms в обычных конфигурациях также сразу обновляют
# кэшированные права Grim.
# Этот периодический резервный механизм нужен только для изменений прав онлайн,
# которые не покрываются этими событиями, например для пользовательского контекста
# LuckPerms, который не вызывает signalContextUpdate, пробелов в контекстах Fabric
# или провайдера прав не LuckPerms, который меняет права в реальном времени.
# Установите -1, чтобы отключить опрос. Положительное значение обновляет каждые X тиков.
update-permission-ticks: -1

config-flavor: V2
config-version: 12

# Aero AC neural module. Every stage is opt-in and each one needs `enabled: true` above it.
# neural.enabled alone collects nothing: a consumer (collection, inference or risk) must be on too.
# Telemetry starts at a player's first attack and stops again after idle-timeout-seconds of no combat.
neural:
    enabled: false
    collection:
        # Explicit, operator-started dataset recording. See docs/dataset.md.
        enabled: false
        target-timeout-ticks: 40
        queue-capacity: 256
        max-sessions: 16
        max-duration-seconds: 1800
        max-session-mib: 128
        max-total-mib: 1024
    windows:
        continuous-size: 96
        attack-before: 20
        attack-after: 10
    telemetry:
        # Frames stop being collected once combat has been quiet this long.
        idle-timeout-seconds: 30
    inference:
        # Requires a running model service; see docs/inference.md. Monitoring only, never a punishment.
        enabled: false
        mode: remote
        endpoint: "http://127.0.0.1:8080/predict"
        timeout-ms: 300
        max-in-flight: 8
        min-interval-ms: 500
        flash:
            # attack: one request per completed attack window. continuous: the last N samples.
            window: attack
            sequence-length: 31
        pro:
            # The larger model runs only when Flash already reported at least trigger-overall.
            enabled: false
            window: continuous
            sequence-length: 96
            trigger-overall: 0.5
            min-interval-ms: 2000
    risk:
        # Accumulates evidence over time. A single high prediction can never reach CONFIRMED alone.
        enabled: false
        # An uncalibrated model output is not a probability; leave this false unless you know why.
        accept-uncalibrated: false
        decay-per-second: 0.01
        max-risk: 20.0
        ai-weight: 0.5
        ai-threshold: 0.80
        ai-clear-threshold: 0.20
        ai-relief: 0.15
        grim-weight: 0.5
        watch: 2.0
        suspicious: 6.0
        confirmed: 12.0
        snapshot-threshold: 8.0
        max-snapshots-per-hour: 12
        snapshot-before: 64
        snapshot-after: 32
        # Столько секунд риск вышедшего игрока помнится, чтобы перезаход не обнулял его. 0 — выключено.
        carry-over-seconds: 300
    mitigation:
        # Phase 6. Turn on only after measuring the false positive rate on your own server.
        enabled: false
        min-state: MITIGATED
        cancel-attacks: false
        duration-seconds: 30
        max-per-hour: 20
    training:
        # Служба обучения, отдельно от инференса: инференс отвечает на вопросы о работающей
        # модели, а эта служба запускает и ведёт обучение новых. Обе выключены, пока серверу
        # не с чем разговаривать.
        enabled: false
        endpoint: "http://127.0.0.1:8090"
        timeout-ms: 2000
        # Required when the training service listens outside loopback. Protect this configuration;
        # an empty token is valid only for a loopback service.
        token: ""
        # Имя каталога под разрешённым корнем сервиса. Если корень сервиса — plugins/AeroAC,
        # значение datasets указывает на корпус, который создаёт встроенный рекордер.
        dataset: "datasets"
    gui:
        # The /aero administrator interface. Reading only: nothing under this key can change a
        # prediction, a risk value, a mitigation, or what a dataset session records.
        enabled: true
        # How often the published snapshot behind every screen is rebuilt.
        refresh-ms: 1000
        floating:
            # The risk indicator above a player, drawn as a viewer-only packet entity. No Bukkit
            # entity or scoreboard team is created, and players without permission never see it.
            enabled: true
            refresh-ms: 500
            # off | all | suspicious | auto
            default-mode: suspicious
        alerts:
            # One alert per meaningful state transition, never one per prediction.
            enabled: true
            min-state: WATCH
            throttle-seconds: 30
        training:
            # Optional read-only report adapter; empty = NOT CONFIGURED. Relative to plugin data folder.
            report-directory: "reports"
            # Recommended collection targets shown as progress bars while recording. They are
            # operator guidance only: missing them does not make a session bad, and meeting them
            # does not make it reviewed, calibrated or usable.
            target-duration-seconds: 300
            target-attack-windows: 150
            # Presets offered by the recording wizard. Extend them freely; the wizard also lets an
            # operator type a value the list does not contain.
            scenarios: [box-pvp, tracking, flick, strafe, flat-duel, custom]
            cheat-families: [aim-assist, kill-aura, trigger-bot, reach, auto-clicker, other]
            client-families: []
            # Coverage goals for the collection helper screen. They say what you still want to
            # record; they say nothing about the false positive rate the dataset can support.
            goal-sessions-per-assist-strength: 20
            goal-distinct-cheat-clients: 5
            goal-high-ping-legit-sessions: 20
        dataset:
            # The dataset summary is read off the main thread and cached for this long.
            cache-seconds: 60
            max-sessions: 5000
            recent-sessions: 45
    enforcement:
        # Whether the anticheat may ask for a ban, and who decides.
        #
        #   off        -- nothing is decided and nothing is announced
        #   announce   -- staff are told what it would have done; a person confirms (default)
        #   automatic  -- the ban runs on its own
        #
        # The default is announce on purpose. The model behind the risk value has not been
        # calibrated against a labelled dataset recorded on this server, so automatic bans would
        # remove honest players and nobody would find out until an appeal. Switch to automatic
        # after measuring your own false positive rate, not before.
        mode: announce
        # Everything below is a gate on a verdict the risk engine already reached. Nothing here
        # changes how risk is computed.
        min-state: CONFIRMED
        min-evidence: 12
        min-predictions: 10
        # One player is decided on at most once per this many seconds.
        cooldown-seconds: 600
        # An announced verdict nobody answered is dropped after this. Silence is a refusal.
        confirm-timeout-seconds: 900
        # Run by the console. {player} and {reason} are substituted; point it at whatever
        # punishment plugin you actually use.
        command: "ban {player} {reason}"
        reason: "Aero AC: unfair advantage"
        animation:
            # The send-off. Cosmetic from end to end: it decides nothing, and a ban that ran
            # without it is the same ban. Try it without banning anyone: /aero ban preview <player>
            enabled: true
            seconds: 5
            # Their gear comes off them on the way up, backpack first and armour last, and lands
            # around the spot for others to pick up. A preview throws copies and keeps everything.
            scatter-inventory: true
            # 0 floats up slowly; 1 is about nine blocks over five seconds.
            levitation-amplifier: 1
            glow: true
            # A lightning flash at the top. Effect only: no damage, no fire.
            lightning: true
            title: true
            # Tells the whole server. Previews never broadcast.
            broadcast: true
            # Sounds are "key pitch volume". Keys, not enum names, so an unknown key is silence
            # rather than an error on another version.
            ascend-sound: "block.beacon.activate 0.6 1.5"
            # Played once a second on the way up, its pitch climbing toward the top.
            charge-sound: "block.note_block.bass 0.5 1.0"
            scatter-sound: "entity.item.break 1.2 0.8"
            # The bang is layered: all of these at once. Any one of them alone is just a sound.
            ban-sounds:
                - "entity.warden.sonic_boom 0.7 2.0"
                - "entity.lightning_bolt.impact 0.8 1.5"
                - "entity.firework_rocket.large_blast 0.6 1.5"
    monitor:
        interval-ms: 1000
    debug:
        enabled: false
