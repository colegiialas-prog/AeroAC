# La configuración principal de Aero AC
# Código fuente: https://github.com/MWHunter/Grim
# Copyright 2025 DefineOutside y contribuyentes, licenciado bajo GPLv3.
# Binarios modificados o plugins con código de Grim deben ser privados o con
# el código fuente disponible para todos los compradores sin costo adicional.

alerts:
    # ¿Además de mandar las alertas a los jugadores, deberíamos mandarlas también a la consola?
    print-to-console: true
    # This controls whether/how alerts are shared between servers connected to your proxy.
    # You must have 'bungee-plugin-message-channel' enabled in your Velocity's configuration if Velocity is in use.
    proxy:
        # Should alerts be sent to other servers connected to your proxy?
        send: false
        # Should the alerts received from other servers be announced to this server?
        receive: false

verbose:
    print-to-console: false

check-for-updates: true

client-brand:
    # Esto quiere decir que no se va a anunciar la marca del cliente si esta cumple alguno de los siguientes regexes:
    ignored-clients:
        - "^vanilla$"
        - "^fabric$"
        - "^quilt$"
        - "^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4},(?:fabric|forge)$"
        - "^Feather Fabric$"
        - "^labymod$"
    # Grim will blacklist specific Forge versions which include built-in Reach hacks (Forge 1.18.2 to 1.19.3).
    # Setting this option to false will allow said clients to connect to the server. Disable this at your own risk.
    disconnect-blacklisted-forge-versions: true

spectators:
    # Ocultar todos los espectadores con el permiso grim.spectator sin importar si realmente están espectando
    hide-regardless: false
    # ¿En qué mundos deberíamos ocultar los espectadores? Si está en blanco, se ocultaran en todos los mundos.
    allowed-worlds:
        - ""

# ¿Cuánto tiempo de espera debería pasar antes de expulsar un jugador por "tiempo de espera agotado"?
# Por defecto, este valor se encuentra en 60 segundos.
max-transaction-time: 60

# Enable this to stop Grim cancelling pongs received from players.
# This may improve compatibility with other anticheats. It may cause issues with packet limiters.
# Do not enable this if you are not sure what you are doing.
disable-pong-cancelling: false

# ¿Debería desactivarse el manejador de resincronización de bloques predeterminado?
# Por defecto, Grim lee los bloques del mundo del servidor y los envía al cliente para corregir la desincronización.
# Si utilizas plugins que crean bloques falsos basados en paquetes (que no existen en el mundo del servidor),
# deberías establecer esto en true para evitar que Grim los sobrescriba con aire o bloques reales.
# Esto fuerza el uso de un manejador "NoOp" (Sin Operación) a menos que se proporcione uno personalizado vía API.
disable-default-resync-handler: false

# Should the duplicate movement packet be cancelled?
# Mojang has fixed this issue in 1.21. This was their attempt to fix the "bucket desync". https://bugs.mojang.com/browse/MC-12363
# This setting only applies to 1.17-1.20.5 clients on 1.8 servers.
cancel-duplicate-packet: true

# Whether or not to ignore the rotation in duplicate packets
ignore-duplicate-packet-rotation: false

Simulation:
    # Por cuanto deberíamos multiplicar la ventaja total cuando el jugador es legítimo
    # Asi es como se ve la configuración por defecto (eje x = segundos, eje y = bloque 1/1000): https://www.desmos.com/calculator/d4ufgxrxer
    setback-decay-multiplier: 0.999
    # ¿Cuánta debería ser la compensacion del movimiento del jugador como para que creemos una violación?
    # Medido en bloques del posible movimiento
    # Tomamos en cuenta a OptiFine cambiando las tablas trigonometricas, pero bajar esto a 0.001 reducirá
    # que FastMath marque el anti-cheat si esta compensación no funciona...
    threshold: 0.001
    # ¿Qué tan grande debería ser una violación en un tick antes de que el jugador se retroceda inmediatamente?
    # -1 para deshabilitar
    immediate-setback-threshold: 0.1
    # ¿Qué tan grande debería ser una ventaja sobre todos los ticks para que empecemos a retroceder?
    # -1 para deshabilitar
    max-advantage: 1
    # Después de 50 segundos con la configuración predeterminada, el jugador ira de 4 bloques -> 1 bloque de ventaja
    # Esto es para prevenir que el jugador obtenga muchas violaciones y no pueda ser capaz de borrarlas
    # Tope de ventaja por defecto (eje x = segundos, eje y = bloque 1/1000): https://www.desmos.com/calculator/4lovswdarj
    max-ceiling: 4
    # Umbral del nivel de violación para el retroceso
    # 1 para el comportamiento antiguo
    setback-violation-threshold: 1

# Comprobaciones para ver si un jugador entro a un bloque durante un movimiento
Phase:
    setbackvl: 1 # Entrar a un bloque mediante bugs puede permitir subir paredes, además esta comprobación es relativamente estable.
    decay: 0.005

AirLiquidPlace:
    cancelvl: 0

FabricatedPlace:
    cancelvl: 5

FarPlace:
    cancelvl: 5

PositionPlace:
    cancelvl: 5

RotationPlace:
    cancelvl: 5

# Comprobación de NoSlow basado en predicciones
# Grim compensa por código de red con errores aquí... difícil de sacar un falso positivo incluso haciendo spam del
# clic derecho y la mano secundaria.
# Mucho mas estable que otros anti-cheats, pero por favor reportar todo falso positivo... he arreglado muchos
# problemas del código de red aquí.
NoSlow:
    # ¿Cuánta debería ser la compensacion como para que se considere trampa?
    # Por defecto esto es más bajo que otras compensaciones
    # Marca por 0.03-0.2 consistentemente con NoSlow activado
    threshold: 0.001
    # Retroceder rápidamente en el primer item para eliminar toda ventaja que NoSlow brinde
    setbackvl: 5
    # Decadencia cuando un jugador usa un item Y se ralentiza por el
    decay: 0.05

Knockback:
    # Por cuanto deberíamos multiplicar la ventaja total cuando el jugador es legítimo
    setback-decay-multiplier: 0.999
    # ¿Cuánta debería ser la compensacion del movimiento del jugador como para que creemos una violación?
    # Medido en bloques del posible movimiento
    threshold: 0.001
    # ¿Qué tan grande debería ser una violación en un tick antes de que el jugador se retroceda inmediatamente?
    # -1 para deshabilitar
    immediate-setback-threshold: 0.1
    # ¿Qué tan grande debería ser una ventaja sobre todos los ticks para que empecemos a retroceder?
    # -1 para deshabilitar
    max-advantage: 1
    # Esto es para prevenir que el jugador obtenga muchas violaciones y no pueda ser capaz de borrarlas
    max-ceiling: 4


Explosion:
    threshold: 0.001
    setbackvl: 3

TimerA:
    setbackvl: 10
    # Milisegundos que el jugador puede acumular para ser usados mas tarde cuando se quedan por detrás
    # Podría llegar a permitir pasos por alto de fast use/fast heal/fast bow en 1.8 si esta muy alto, 120 ms
    # parece ser un balance bastante decente.
    drift: 120

# This check limits abuse of the TimerA balance by preventing the player's movement falling too far behind realtime
TimerLimit:
    # Ping at which the check will start to limit timer balance, to prevent abuse.
    # Can cause some setbacks for legitimate players but only if they are over this ping threshold.
    # -1 to disable
    ping-abuse-limit-threshold: 1000

NegativeTimer:
    # Number of milliseconds lost while moving before we should start flagging
    drift: 1200

# La misma comprobación que TimerA, pero para vehiculos
VehicleTimer:
    # Target 1.005 timer
    setbackvl: 10

PacketOrderI:
    # Habilitar si los jugadores están siendo marcados por usar mods de animación de la 1.7
    exempt-placing-while-digging: false

Reach:
    # Cuanto deberíamos expandir las hit-boxes? 0.0005 debería detectar un reach de 3.0005+
    #
    # Hay una expansion forzada de 0.03 con 1.9-1.18.1 (1.18.2 no) y algunas combinaciones de clientes/servidores
    # debido a cambios en el protocolo y limitaciones. Esta comprobación es más poderosa en clientes 1.7 y 1.8
    # conectados a un servidor 1.8
    threshold: 0.0005
    # ¿Deberíamos cancelar golpes que sabemos que son imposibles?
    # Golpes de 3.00-3.03 puede que aun asi pasen, pero se marcaran debido a limitaciones del orden de paquetes.
    block-impossible-hits: true
    # Esto mandará un paquete adicional al final de cada tick para aumentar las chances de encontrar trampas
    # Esto se inyecta en la lista de conexiones del servidor para mandar un paquete final justo antes de que el servidor haga "flush".
    # Habilitar esto causará que el uso de banda ancha de todos los jugadores aumente
    # Esto no disminuirá el rendimiento del servidor.
    # Habilitar esto ayudará a encontrar más jugadores haciendo trampa.
    # Dejar esto deshabilitado también encontrara a jugadores haciendo trampa y no causara falsos positivos.
    # Excepto que seas un servidor 1.8 enfocado en el PvP, este paquete adicional no es recomendado.
    enable-post-packet: false

exploit:
    allow-sprint-jumping-when-using-elytra: true
    # Esta opción mitiga la colocación del jugador en bloques fantasma resincronizando al jugador cuando ocurre.
    allow-building-on-ghostblocks: true
    distance-to-check-if-ghostblocks: 2

# Habilitar el registro de plugins que se han inyectado a netty para intentar resolver problemas de compatibilidad.
debug-pipeline-on-join: false

# Habilitar comprobaciones experimentales
experimental-checks: false

reset-item-usage-on-item-update: true
reset-item-usage-on-attack: true
reset-item-usage-on-slot-change: true
reset-item-usage-on-item-use: true

# Grim a veces cancela paquetes ilegal como los de Timer. Después de X paquetes en un solo segundo cancelados,
# cuando deberíamos simplemente expulsar al jugador? Esto es obligatorio ya que algunos limitadores de paquetes
# no cuentan los paquetes cancelados por Grim.
packet-spam-threshold: 100
# Activa esto para imprimir un stacktrace cuando un jugador sea expulsado por packet-spam-threshold
debug-packet-cancel: false

# Grim puede hacer cumplir que un jugador que ha salido del estado de vuelo no tenga más de X ms de ping
# Esto se debe a que Grim actualmente no comprueba a los jugadores que están volando
# Para desactivar, usa -1
max-ping-out-of-flying: 1000

# Ping máximo cuando se elimina el impulso de fuegos artificiales del jugador.
# Esto evita que los jugadores con alta latencia puedan usar un solo impulso con fuegos artificiales y una elytra para siempre.
max-ping-firework-boost: 1000

# Marcadores de esquema — toca solo si sabes lo que haces.
#   config-flavor:  V2 = build de Grim 2.x, V3 = Grim 3.x. El plugin se niega
#                   a cargar una config cuyo flavor no coincida con su propio
#                   build; una config V3 abierta por un jar V2 falla rápido en
#                   vez de fusionarse silenciosamente en claves equivocadas.
#   config-version: se incrementa con cada cambio de forma incompatible. Las
#                   configs antiguas se migran automáticamente con el updater
#                   incluido al siguiente arranque.
# Grim siempre actualiza los permisos en caché cuando un jugador entra y cuando
# Grim se recarga, tenga o no LuckPerms instalado.
# Los hooks de eventos de LuckPerms también actualizan inmediatamente los permisos
# de Grim en caché en configuraciones normales.
# Este respaldo periódico solo es necesario para cambios de permisos en línea no
# cubiertos por esos eventos, como un contexto personalizado de LuckPerms que no
# llame a signalContextUpdate, huecos de contexto en Fabric o un proveedor de
# permisos que no sea LuckPerms y cambie permisos en vivo.
# Usa -1 para desactivar el sondeo. Usa un valor positivo para actualizar cada X ticks.
update-permission-ticks: -1

config-flavor: V2
config-version: 12

# Aero AC neural module. Every stage is opt-in and each one needs `enabled: true` above it.
# neural.enabled alone collects nothing: a consumer (collection, inference or risk) must be on too.
# Telemetry starts at a player's first attack and stops again after idle-timeout-seconds of no combat.
neural:
    enabled: false
    collection:
        # Explicit, operator-started dataset recording. See docs/dataset.md.
        enabled: false
        target-timeout-ticks: 40
        queue-capacity: 256
        max-sessions: 16
        max-duration-seconds: 1800
        max-session-mib: 128
        max-total-mib: 1024
    windows:
        continuous-size: 96
        attack-before: 20
        attack-after: 10
    telemetry:
        # Frames stop being collected once combat has been quiet this long.
        idle-timeout-seconds: 30
    inference:
        # Requires a running model service; see docs/inference.md. Monitoring only, never a punishment.
        enabled: false
        # remote: POST windows to the Python service at endpoint. local: run the exported bundle
        # inside the server (no service, ~2 ms per Flash window on a background thread).
        mode: remote
        endpoint: "http://127.0.0.1:8080/predict"
        local:
            # Bundle directories written by the training pipeline (manifest.json, weights.json,
            # model.weights), relative to the plugin folder. An empty pro-bundle keeps Pro off.
            flash-bundle: "models/flash"
            pro-bundle: ""
            threads: 2
        timeout-ms: 300
        max-in-flight: 8
        min-interval-ms: 500
        flash:
            # attack: one request per completed attack window. continuous: the last N samples.
            window: attack
            sequence-length: 31
        pro:
            # The larger model runs only when Flash already reported at least trigger-overall.
            enabled: false
            window: continuous
            sequence-length: 96
            trigger-overall: 0.5
            min-interval-ms: 2000
    risk:
        # Accumulates evidence over time. A single high prediction can never reach CONFIRMED alone.
        enabled: false
        # An uncalibrated model output is not a probability; leave this false unless you know why.
        accept-uncalibrated: false
        # log-odds: each window adds log-odds-weight * (logit(p) - logit(prior)), shared out over
        # overlapping windows; honest windows lower risk by the evidence they carry. threshold: the
        # older rule, only p >= ai-threshold raises risk and p <= ai-clear-threshold relieves it.
        ai-scoring: log-odds
        log-odds-weight: 0.5
        # Base rate used when the model service does not report the one it was calibrated under.
        ai-neutral: 0.5
        ai-clamp-low: 0.02
        ai-clamp-high: 0.98
        # Multiplier on negative (legitimate-looking) evidence. 1 = symmetric.
        relief-scale: 0.5
        # Half-life ~11.5 minutes. Honest play already walks risk down in log-odds mode, so time
        # decay no longer has to be fast enough to forgive short bursts of fighting.
        decay-per-second: 0.001
        max-risk: 20.0
        ai-weight: 0.5
        ai-threshold: 0.80
        ai-clear-threshold: 0.20
        ai-relief: 0.15
        grim-weight: 0.5
        watch: 2.0
        suspicious: 6.0
        confirmed: 12.0
        snapshot-threshold: 8.0
        max-snapshots-per-hour: 12
        snapshot-before: 64
        snapshot-after: 32
        # Remember risk across restarts and reloads in plugins/AeroAC/neural/risk-store.json for this
        # many hours (0 disables). It decays for the time the player was away and is restored at most
        # to restore-cap: the evidence behind it is gone, so it can start a watch but not a verdict.
        persist-hours: 72
        restore-cap: 4.0
    mitigation:
        # Phase 6. Turn on only after measuring the false positive rate on your own server.
        enabled: false
        min-state: MITIGATED
        # true drops every attack while an action runs (same as cancel-chance: 1.0).
        cancel-attacks: false
        # Share of attacks dropped, drawn per attack; 0.25 feels like a bad connection, not a ban.
        cancel-chance: 0.0
        # Damage the player deals, melee and projectiles (Bukkit/Paper/Folia). 1.0 = unchanged.
        damage-multiplier: 1.0
        duration-seconds: 30
        max-per-hour: 20
        # Random delay before an action takes effect and random extra length at its end, so the
        # moment the nerf starts cannot be used to find the detection threshold.
        onset-delay-min-seconds: 5
        onset-delay-max-seconds: 20
        release-jitter-seconds: 10
    training:
        # The training service, separate from inference: inference answers questions about a
        # running model, this starts and watches runs that produce one. Both are off unless the
        # server has something to talk to.
        enabled: false
        endpoint: "http://127.0.0.1:8090"
        timeout-ms: 2000
        # Required when the training service listens outside loopback. Protect this configuration;
        # an empty token is valid only for a loopback service.
        token: ""
        # Server-side directory name under the service's allowed root. Point the service at the
        # plugin data directory to train the recorder's plugins/AeroAC/datasets corpus.
        dataset: "datasets"
    gui:
        # The /aero administrator interface. Reading only: nothing under this key can change a
        # prediction, a risk value, a mitigation, or what a dataset session records.
        enabled: true
        # How often the published snapshot behind every screen is rebuilt.
        refresh-ms: 1000
        floating:
            # The risk indicator above a player, drawn as a viewer-only packet entity. No Bukkit
            # entity or scoreboard team is created, and players without permission never see it.
            enabled: true
            refresh-ms: 500
            # off | all | suspicious | auto
            default-mode: suspicious
        alerts:
            # One alert per meaningful state transition, never one per prediction.
            enabled: true
            min-state: WATCH
            throttle-seconds: 30
        training:
            # Optional read-only report adapter; empty = NOT CONFIGURED. Relative to plugin data folder.
            report-directory: "reports"
            # Recommended collection targets shown as progress bars while recording. They are
            # operator guidance only: missing them does not make a session bad, and meeting them
            # does not make it reviewed, calibrated or usable.
            target-duration-seconds: 300
            target-attack-windows: 150
            # Presets offered by the recording wizard. Extend them freely; the wizard also lets an
            # operator type a value the list does not contain.
            scenarios: [box-pvp, tracking, flick, strafe, flat-duel, custom]
            cheat-families: [aim-assist, kill-aura, trigger-bot, reach, auto-clicker, other]
            client-families: []
            # Coverage goals for the collection helper screen. They say what you still want to
            # record; they say nothing about the false positive rate the dataset can support.
            goal-sessions-per-assist-strength: 20
            goal-distinct-cheat-clients: 5
            goal-high-ping-legit-sessions: 20
        dataset:
            # The dataset summary is read off the main thread and cached for this long.
            cache-seconds: 60
            max-sessions: 5000
            recent-sessions: 45
    enforcement:
        # Whether the anticheat may ask for a ban, and who decides.
        #
        #   off        -- nothing is decided and nothing is announced
        #   announce   -- staff are told what it would have done; a person confirms (default)
        #   automatic  -- the ban runs on its own
        #
        # The default is announce on purpose. The model behind the risk value has not been
        # calibrated against a labelled dataset recorded on this server, so automatic bans would
        # remove honest players and nobody would find out until an appeal. Switch to automatic
        # after measuring your own false positive rate, not before.
        mode: announce
        # Everything below is a gate on a verdict the risk engine already reached. Nothing here
        # changes how risk is computed.
        min-state: CONFIRMED
        min-evidence: 12
        min-predictions: 10
        # One player is decided on at most once per this many seconds.
        cooldown-seconds: 600
        # An announced verdict nobody answered is dropped after this. Silence is a refusal.
        confirm-timeout-seconds: 900
        # automatic mode only: collect verdicts and carry them out together in a ban wave this many
        # minutes later (randomised between half and one and a half periods). An instant ban tells a
        # cheat developer which fight and which setting tripped the detector. 0 bans at once.
        wave-minutes: 30
        # Run by the console. {player} and {reason} are substituted; point it at whatever
        # punishment plugin you actually use.
        command: "ban {player} {reason}"
        reason: "Aero AC: unfair advantage"
        animation:
            # The send-off. Cosmetic from end to end: it decides nothing, and a ban that ran
            # without it is the same ban. Try it without banning anyone: /aero ban preview <player>
            enabled: true
            seconds: 5
            # Their gear comes off them on the way up, backpack first and armour last, and lands
            # around the spot for others to pick up. A preview throws copies and keeps everything.
            scatter-inventory: true
            # 0 floats up slowly; 1 is about nine blocks over five seconds.
            levitation-amplifier: 1
            glow: true
            # A lightning flash at the top. Effect only: no damage, no fire.
            lightning: true
            title: true
            # Tells the whole server. Previews never broadcast.
            broadcast: true
            # Sounds are "key pitch volume". Keys, not enum names, so an unknown key is silence
            # rather than an error on another version.
            ascend-sound: "block.beacon.activate 0.6 1.5"
            # Played once a second on the way up, its pitch climbing toward the top.
            charge-sound: "block.note_block.bass 0.5 1.0"
            scatter-sound: "entity.item.break 1.2 0.8"
            # The bang is layered: all of these at once. Any one of them alone is just a sound.
            ban-sounds:
                - "entity.warden.sonic_boom 0.7 2.0"
                - "entity.lightning_bolt.impact 0.8 1.5"
                - "entity.firework_rocket.large_blast 0.6 1.5"
    monitor:
        interval-ms: 1000
    debug:
        enabled: false
