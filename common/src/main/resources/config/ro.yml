# Configurația principală Aero AC
# Cod sursă: https://github.com/MWHunter/Grim
# Drepturi de autor 2025 DefineOutside și colaboratorii, licențiat sub GPLv3.
# Binarele modificate sau pluginurile cu cod Grim copiat trebuie să fie private,
# sau cu întregul cod sursă disponibil cumpărătorilor fără costuri suplimentare.

alerts:
    # Pe lângă transmiterea alertelor către jucători, ar trebui să fie trimise și în consolă?
    print-to-console: true
    # Aceasta controlează dacă/și cum sunt partajate alertele între serverele conectate la proxy.
    # Trebuie să ai 'bungee-plugin-message-channel' activat în configurația Velocity dacă Velocity este folosit.
    proxy:
        # Ar trebui ca alertele să fie trimise către alte servere conectate la proxy?
        send: false
        # Ar trebui ca alertele primite de la alte servere să fie anunțate pe acest server?
        receive: false

verbose:
    print-to-console: false

check-for-updates: true

client-brand:
    # Aceasta înseamnă că nu va transmite operatorilor brandul clientului dacă brandul se potrivește cu regex-urile de mai jos
    ignored-clients:
        - "^vanilla$"
        - "^fabric$"
        - "^quilt$"
        - "^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4},(?:fabric|forge)$"
        - "^Feather Fabric$"
        - "^labymod$"
    # Grim va bloca anumite versiuni Forge care includ hackuri Reach integrate (Forge 1.18.2 până la 1.19.3).
    # Setarea acestei opțiuni la false va permite acestor clienți să se conecteze la server. Dezactivează pe propriul risc.
    disconnect-blacklisted-forge-versions: true

spectators:
    # Ascunde toți spectatorii cu permisiunea grim.spectator indiferent dacă spectează activ sau nu
    hide-regardless: false
    # Va face spectatorii invizibili doar în aceste lumi, lasă gol pentru a permite în toate lumile
    allowed-worlds:
        - ""

# Cât timp au jucătorii până să fie deconectați pentru timeout? Implicit = 60 secunde
max-transaction-time: 60

# Activează pentru a opri Grim din a anula pongs primite de la jucători.
# Poate îmbunătăți compatibilitatea cu alte anticheaturi. Poate cauza probleme cu limitatoarele de pachete.
# Nu activa dacă nu ești sigur ce faci.
disable-pong-cancelling: false

# Ar trebui dezactivat handler-ul implicit de resincronizare a blocurilor?
# Implicit, Grim citește blocurile din lumea serverului și le trimite clientului pentru a repara desincronizarea.
# Dacă utilizați plugin-uri care creează blocuri false bazate pe pachete (care nu există în lumea serverului),
# ar trebui să setați acest lucru pe true pentru a preveni ca Grim să le suprascrie cu aer/blocuri reale.
# Acest lucru forțează utilizarea unui handler "NoOp" (Fără Operațiune), cu excepția cazului în care unul personalizat este furnizat prin API.
disable-default-resync-handler: false

# Ar trebui să fie anulat pachetul de mișcare duplicat?
# Mojang a reparat această problemă în 1.21. A fost încercarea lor de a rezolva „bucket desync”. https://bugs.mojang.com/browse/MC-12363
# Această setare se aplică doar clienților 1.17-1.20.5 pe servere 1.8.
cancel-duplicate-packet: true

# Dacă să se ignore rotația în pachetele duplicate
ignore-duplicate-packet-rotation: false

Simulation:
    # Cu cât ar trebui să înmulțim avantajul total atunci când jucătorul este legitim
    # Așa arată configurația implicită (axa X = secunde, axa Y = 1/1000 bloc): https://www.desmos.com/calculator/d4ufgxrxer
    setback-decay-multiplier: 0.999
    # Cât de mare trebuie să fie abaterea de la mișcarea jucătorului pentru a crea o încălcare?
    # Măsurat în blocuri față de mișcarea posibilă
    # Luăm în considerare Optifine schimbând tabelele trig, dar scăderea la 0.001 va reduce FastMath
    # și ar putea marca anticheatul dacă această compensație nu funcționează...
    threshold: 0.001
    # Cât de mare trebuie să fie încălcarea într-un tick pentru a da setback imediat?
    # -1 pentru a dezactiva
    immediate-setback-threshold: 0.1
    # Cât de mare avantaj acumulat înainte să începem setback?
    # -1 pentru a dezactiva
    max-advantage: 1
    # După 50 de secunde cu setările implicite, jucătorul va trece de la 4 blocuri -> 1 bloc avantaj
    # Aceasta previne acumularea prea multor încălcări fără șansă de reset
    # Grafic implicit avantaj (axa X = secunde, axa Y = 1/1000 bloc): https://www.desmos.com/calculator/4lovswdarj
    max-ceiling: 4
    # Pragul de încălcare pentru setback
    # 1 pentru comportamentul vechi
    setback-violation-threshold: 1

# Verifică dacă un jucător a intrat într-un bloc în timpul mișcării
Phase:
    setbackvl: 1 # Glitch-ul în blocuri poate permite escaladarea pereților, iar acest check e relativ stabil
    decay: 0.005

AirLiquidPlace:
    cancelvl: 0

FabricatedPlace:
    cancelvl: 5

FarPlace:
    cancelvl: 5

PositionPlace:
    cancelvl: 5

RotationPlace:
    cancelvl: 5

# Verificare NoSlow bazată pe predicție
# Grim ține cont de netcode-ul buguit aici... greu de fals chiar și când spamezi click dreapta și butonul offhand
# Mult mai stabil decât alte anticheaturi, dar raportează orice falsuri... am reparat multe probleme de netcode aici.
NoSlow:
    # Cât de mare abatere e considerată „cheating”
    # Implicit este mai mică decât alte offs
    # Marchează între 0.03-0.2 constant cu NoSlow activ
    threshold: 0.001
    # Setback rapid la primul obiect pentru a elimina orice avantaj dat de NoSlow
    setbackvl: 5
    # Scade atunci când jucătorul folosește un item ȘI este încetinit de acesta
    decay: 0.05

Knockback:
    # Cu cât ar trebui să înmulțim avantajul total atunci când jucătorul este legitim
    setback-decay-multiplier: 0.999
    # Cât de mare trebuie să fie abaterea față de viteza jucătorului pentru a crea o încălcare?
    # Măsurat în blocuri față de viteza posibilă
    threshold: 0.001
    # Cât de mare trebuie să fie încălcarea într-un tick pentru setback imediat?
    # -1 pentru a dezactiva
    immediate-setback-threshold: 0.1
    # Cât de mare avantaj acumulat înainte să începem setback?
    # -1 pentru a dezactiva
    max-advantage: 1
    # Previne acumularea prea multor încălcări imposibil de resetat
    max-ceiling: 4

Explosion:
    threshold: 0.001
    setbackvl: 3

TimerA:
    setbackvl: 10
    # Milisecunde pe care jucătorul le poate acumula pentru folosire ulterioară când rămâne în urmă
    # Poate permite bypass-uri fast use/fast heal/fast bow pe 1.8 dacă e setat prea mare, 120 ms e un echilibru bun
    drift: 120

# Acest check limitează abuzul TimerA prevenind mișcarea jucătorului să rămână prea mult în urmă față de timpul real
TimerLimit:
    # Ping la care check-ul începe să limiteze balanța timer, pentru a preveni abuzul.
    # Poate cauza setback pentru jucători legitimi doar dacă sunt peste acest prag de ping.
    # -1 pentru a dezactiva
    ping-abuse-limit-threshold: 1000

NegativeTimer:
    # Număr de milisecunde pierdute în timp ce se mișcă înainte de a începe să marcheze
    drift: 1200

# Aceeași metodă de verificare ca TimerA, dar pentru vehicule
VehicleTimer:
    # Țintă timer 1.005
    setbackvl: 10

PacketOrderI:
    # activează dacă jucătorii sunt marcați folosind moduri de animații 1.7
    exempt-placing-while-digging: false

Reach:
    # Cu cât să mărim hitboxurile? 0.0005 ar trebui să detecteze reach 3.0005+
    #
    # Există o extindere forțată de 0.03 cu clienți 1.9-1.18.1 (nu 1.18.2), sau unele combinații client/server datorită
    # schimbărilor și limitărilor protocolului. Acest check este cel mai puternic cu clienți 1.7/1.8 pe servere 1.8.
    threshold: 0.0005
    # Ar trebui să anulăm loviturile imposibile?
    # Lovituri de 3.00-3.03 pot trece dar tot vor fi marcate, din cauza limitărilor de ordine a pachetelor
    block-impossible-hits: true
    # Va trimite un pachet suplimentar la sfârșitul fiecărui tick pentru a crește șansele de a prinde cheat-uri
    # Injectează în lista de conexiuni a serverului pentru a trimite un pachet final chiar înainte ca serverul să facă flush
    # Activarea va crește traficul pentru toți jucătorii
    # Nu va scădea performanța serverului
    # Activarea va prinde mai mulți cheateri.
    # Lăsarea dezactivată va prinde totuși cheateri și nu va cauza false positive
    # Dacă nu ești server PvP 1.8, acest pachet suplimentar nu este recomandat
    enable-post-packet: false

exploit:
    # Poți obține viteze mari sărind sprint cu elytra, aceasta previne exploitul dacă e setat pe false
    # Mojang a stricat netcode-ul făcând startul elytra client-side și finalul server-side
    # Elytra are fricțiune orizontală 0.99, așa că adăugând constant 0.2 viteză rezultă în viteze foarte mari.
    allow-sprint-jumping-when-using-elytra: true
    # Această opțiune reduce efectul ghostblocks prin resincronizarea jucătorului când se întâmplă
    allow-building-on-ghostblocks: true
    # Această setare, influențată de booleanul de mai sus, definește distanța verificată pentru ghostblocks
    # Interval valid: 2 până la 4
    distance-to-check-if-ghostblocks: 2

# Activează logarea pluginurilor care s-au injectat în netty la intrare pentru debugging de compatibilitate
debug-pipeline-on-join: false

# Activează verificări experimentale
experimental-checks: false

reset-item-usage-on-item-update: true
reset-item-usage-on-attack: true
reset-item-usage-on-slot-change: true

# Grim uneori anulează pachete ilegale precum timer, după X pachete anulate într-o secundă, când să
# deconectăm jucătorul? Este necesar deoarece unele limitatoare de pachete nu numără pachetele anulate de Grim.
packet-spam-threshold: 100
# Activează pentru a afișa stacktrace când un jucător e deconectat din cauza packet-spam-threshold
debug-packet-cancel: false

# Grim poate aplica ca un jucător scos din starea de zbor să nu aibă mai mult de X ms ping
# Deoarece Grim nu verifică în prezent jucătorii care zboară
# Pentru dezactivare, folosește -1
max-ping-out-of-flying: 1000

# Ping maxim când boost-ul cu artificii este eliminat de la jucător.
# Previne jucătorii cu latență mare să folosească un boost cu artificii la infinit cu elytra.
max-ping-firework-boost: 1000

# Markeri de schemă — modifică-i doar dacă știi ce faci.
#   config-flavor:  V2 = build Grim 2.x, V3 = Grim 3.x. Plugin-ul refuză să
#                   încarce o configurație al cărei flavor nu se potrivește cu
#                   build-ul propriu — o config V3 deschisă de un jar V2
#                   eșuează imediat în loc să fuzioneze în tăcere în chei
#                   greșite.
#   config-version: incrementat la fiecare schimbare de formă incompatibilă.
#                   Configurațiile vechi sunt migrate automat de updater-ul
#                   inclus la următoarea pornire.
# Grim reîmprospătează întotdeauna permisiunile memorate în cache când un jucător
# intră și când Grim este reîncărcat, indiferent dacă LuckPerms este instalat.
# Hook-urile de evenimente LuckPerms reîmprospătează imediat și permisiunile Grim
# din cache în configurațiile obișnuite.
# Acest fallback periodic este necesar doar pentru schimbări online de permisiuni
# neacoperite de acele evenimente, cum ar fi un context LuckPerms personalizat care
# nu apelează signalContextUpdate, lipsuri de context pe Fabric sau un furnizor de
# permisiuni diferit de LuckPerms care schimbă permisiuni live.
# Setează -1 pentru a dezactiva interogarea periodică. Setează o valoare pozitivă pentru a reîmprospăta la fiecare X tick-uri.
update-permission-ticks: -1

config-flavor: V2
config-version: 12

# Aero AC neural module. Every stage is opt-in and each one needs `enabled: true` above it.
# neural.enabled alone collects nothing: a consumer (collection, inference or risk) must be on too.
# Telemetry starts at a player's first attack and stops again after idle-timeout-seconds of no combat.
neural:
    enabled: false
    collection:
        # Explicit, operator-started dataset recording. See docs/dataset.md.
        enabled: false
        target-timeout-ticks: 40
        queue-capacity: 256
        max-sessions: 16
        max-duration-seconds: 1800
        max-session-mib: 128
        max-total-mib: 1024
    windows:
        continuous-size: 96
        attack-before: 20
        attack-after: 10
    telemetry:
        # Frames stop being collected once combat has been quiet this long.
        idle-timeout-seconds: 30
    inference:
        # Requires a running model service; see docs/inference.md. Monitoring only, never a punishment.
        enabled: false
        # remote: POST windows to the Python service at endpoint. local: run the exported bundle
        # inside the server (no service, ~2 ms per Flash window on a background thread).
        mode: remote
        endpoint: "http://127.0.0.1:8080/predict"
        local:
            # Bundle directories written by the training pipeline (manifest.json, weights.json,
            # model.weights), relative to the plugin folder. An empty pro-bundle keeps Pro off.
            flash-bundle: "models/flash"
            pro-bundle: ""
            threads: 2
        timeout-ms: 300
        max-in-flight: 8
        min-interval-ms: 500
        flash:
            # attack: one request per completed attack window. continuous: the last N samples.
            window: attack
            sequence-length: 31
        pro:
            # The larger model runs only when Flash already reported at least trigger-overall.
            enabled: false
            window: continuous
            sequence-length: 96
            trigger-overall: 0.5
            min-interval-ms: 2000
    risk:
        # Accumulates evidence over time. A single high prediction can never reach CONFIRMED alone.
        enabled: false
        # An uncalibrated model output is not a probability; leave this false unless you know why.
        accept-uncalibrated: false
        # log-odds: each window adds log-odds-weight * (logit(p) - logit(prior)), shared out over
        # overlapping windows; honest windows lower risk by the evidence they carry. threshold: the
        # older rule, only p >= ai-threshold raises risk and p <= ai-clear-threshold relieves it.
        ai-scoring: log-odds
        log-odds-weight: 0.5
        # Base rate used when the model service does not report the one it was calibrated under.
        ai-neutral: 0.5
        ai-clamp-low: 0.02
        ai-clamp-high: 0.98
        # Multiplier on negative (legitimate-looking) evidence. 1 = symmetric.
        relief-scale: 0.5
        # Half-life ~11.5 minutes. Honest play already walks risk down in log-odds mode, so time
        # decay no longer has to be fast enough to forgive short bursts of fighting.
        decay-per-second: 0.001
        max-risk: 20.0
        ai-weight: 0.5
        ai-threshold: 0.80
        ai-clear-threshold: 0.20
        ai-relief: 0.15
        grim-weight: 0.5
        watch: 2.0
        suspicious: 6.0
        confirmed: 12.0
        snapshot-threshold: 8.0
        max-snapshots-per-hour: 12
        snapshot-before: 64
        snapshot-after: 32
        # Remember risk across restarts and reloads in plugins/AeroAC/neural/risk-store.json for this
        # many hours (0 disables). It decays for the time the player was away and is restored at most
        # to restore-cap: the evidence behind it is gone, so it can start a watch but not a verdict.
        persist-hours: 72
        restore-cap: 4.0
        # Share of cheaters among fighting players you expect. Only used to turn risk into the
        # "cheat probability over the whole fight" operators see; it never moves risk itself.
        cheater-share: 0.02
        # How much of the summed evidence that estimate trusts. Windows of one player are strongly
        # correlated; at 1.0 SUSPICIOUS would read as 99.97%. 0.25 maps WATCH/SUSPICIOUS/CONFIRMED to
        # roughly 5% / 29% / 89%. Fit it on labelled sessions once you have them.
        probability-scale: 0.25
    mitigation:
        # Phase 6. Turn on only after measuring the false positive rate on your own server.
        enabled: false
        min-state: MITIGATED
        # true drops every attack while an action runs (same as cancel-chance: 1.0).
        cancel-attacks: false
        # Share of attacks dropped, drawn per attack; 0.25 feels like a bad connection, not a ban.
        cancel-chance: 0.0
        # Damage the player deals, melee and projectiles (Bukkit/Paper/Folia). 1.0 = unchanged.
        damage-multiplier: 1.0
        duration-seconds: 30
        max-per-hour: 20
        # Random delay before an action takes effect and random extra length at its end, so the
        # moment the nerf starts cannot be used to find the detection threshold.
        onset-delay-min-seconds: 5
        onset-delay-max-seconds: 20
        release-jitter-seconds: 10
    training:
        # The training service, separate from inference: inference answers questions about a
        # running model, this starts and watches runs that produce one. Both are off unless the
        # server has something to talk to.
        # local (default): train inside the plugin in Java, no Python and no service.
        # service: the external Python service (enabled/endpoint/token below).
        mode: local
        local:
            # Maximum epochs; training stops earlier once validation stops improving.
            epochs: 30
            # CPU threads for training (low priority, never the game thread).
            threads: 2
            # Use CHEAT/LEGIT verdicts staff gave snapshots in the GUI (training fold only).
            include-staff-reviews: true
            # Also use recordings the audit marked REVIEW, not only clean ones.
            include-review: false
            # auto: split folds by player, or by recording when there are too few players (one
            # operator against the bot); scores are then optimistic. player / session to force one.
            split: auto
        enabled: false
        endpoint: "http://127.0.0.1:8090"
        timeout-ms: 2000
        # Required when the training service listens outside loopback. Protect this configuration;
        # an empty token is valid only for a loopback service.
        token: ""
        # Server-side directory name under the service's allowed root. Point the service at the
        # plugin data directory to train the recorder's plugins/AeroAC/datasets corpus.
        dataset: "datasets"
    gui:
        # The /aero administrator interface. Reading only: nothing under this key can change a
        # prediction, a risk value, a mitigation, or what a dataset session records.
        enabled: true
        # How often the published snapshot behind every screen is rebuilt.
        refresh-ms: 1000
        floating:
            # The risk indicator above a player, drawn as a viewer-only packet entity. No Bukkit
            # entity or scoreboard team is created, and players without permission never see it.
            enabled: true
            refresh-ms: 500
            # off | all | suspicious | auto
            default-mode: suspicious
        alerts:
            # One alert per meaningful state transition, never one per prediction.
            enabled: true
            min-state: WATCH
            throttle-seconds: 30
        training:
            # Optional read-only report adapter; empty = NOT CONFIGURED. Relative to plugin data folder.
            report-directory: "reports"
            # Recommended collection targets shown as progress bars while recording. They are
            # operator guidance only: missing them does not make a session bad, and meeting them
            # does not make it reviewed, calibrated or usable.
            target-duration-seconds: 300
            target-attack-windows: 150
            # Presets offered by the recording wizard. Extend them freely; the wizard also lets an
            # operator type a value the list does not contain.
            scenarios: [box-pvp, tracking, flick, strafe, flat-duel, custom]
            cheat-families: [aim-assist, kill-aura, trigger-bot, reach, auto-clicker, other]
            client-families: []
            # Coverage goals for the collection helper screen. They say what you still want to
            # record; they say nothing about the false positive rate the dataset can support.
            goal-sessions-per-assist-strength: 20
            goal-distinct-cheat-clients: 5
            goal-high-ping-legit-sessions: 20
        dataset:
            # The dataset summary is read off the main thread and cached for this long.
            cache-seconds: 60
            max-sessions: 5000
            recent-sessions: 45
    enforcement:
        # Whether the anticheat may ask for a ban, and who decides.
        #
        #   off        -- nothing is decided and nothing is announced
        #   announce   -- staff are told what it would have done; a person confirms (default)
        #   automatic  -- the ban runs on its own
        #
        # The default is announce on purpose. The model behind the risk value has not been
        # calibrated against a labelled dataset recorded on this server, so automatic bans would
        # remove honest players and nobody would find out until an appeal. Switch to automatic
        # after measuring your own false positive rate, not before.
        mode: announce
        # Everything below is a gate on a verdict the risk engine already reached. Nothing here
        # changes how risk is computed.
        min-state: CONFIRMED
        min-evidence: 12
        min-predictions: 10
        # One player is decided on at most once per this many seconds.
        cooldown-seconds: 600
        # An announced verdict nobody answered is dropped after this. Silence is a refusal.
        confirm-timeout-seconds: 900
        # automatic mode only: collect verdicts and carry them out together in a ban wave this many
        # minutes later (randomised between half and one and a half periods). An instant ban tells a
        # cheat developer which fight and which setting tripped the detector. 0 bans at once.
        wave-minutes: 30
        # Run by the console. {player} and {reason} are substituted; point it at whatever
        # punishment plugin you actually use.
        command: "ban {player} {reason}"
        reason: "Aero AC: unfair advantage"
        animation:
            # The send-off. Cosmetic from end to end: it decides nothing, and a ban that ran
            # without it is the same ban. Try it without banning anyone: /aero ban preview <player>
            enabled: true
            seconds: 5
            # Their gear comes off them on the way up, backpack first and armour last, and lands
            # around the spot for others to pick up. A preview throws copies and keeps everything.
            scatter-inventory: true
            # 0 floats up slowly; 1 is about nine blocks over five seconds.
            levitation-amplifier: 1
            glow: true
            # A lightning flash at the top. Effect only: no damage, no fire.
            lightning: true
            title: true
            # Tells the whole server. Previews never broadcast.
            broadcast: true
            # Sounds are "key pitch volume". Keys, not enum names, so an unknown key is silence
            # rather than an error on another version.
            ascend-sound: "block.beacon.activate 0.6 1.5"
            # Played once a second on the way up, its pitch climbing toward the top.
            charge-sound: "block.note_block.bass 0.5 1.0"
            scatter-sound: "entity.item.break 1.2 0.8"
            # The bang is layered: all of these at once. Any one of them alone is just a sound.
            ban-sounds:
                - "entity.warden.sonic_boom 0.7 2.0"
                - "entity.lightning_bolt.impact 0.8 1.5"
                - "entity.firework_rocket.large_blast 0.6 1.5"
    monitor:
        interval-ms: 1000
    debug:
        enabled: false
