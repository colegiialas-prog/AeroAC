[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aeroml"
version = "0.1.0"
description = "Aero AC dataset pipeline, combat models and inference service"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
train = ["torch>=2.1", "onnx>=1.15", "onnxruntime>=1.17", "onnxscript>=0.1"]
serve = ["onnxruntime>=1.17", "fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8.0"]

[project.scripts]
aero-train = "aeroml.training.train:main"
aero-serve = "aeroml.service.app:main"
aero-synthetic = "aeroml.tools.make_synthetic:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:aeroml.*"]

[tool.setuptools.packages.find]
include = ["aeroml*"]
